# 本地开发用的 PostgreSQL。用户名/密码/库名与 configs/dev.yml 里的
# data.database 一致,起来就能直接 make dev。
#
# internal/data/schema/ 下的建表 DDL 会在**第一次**初始化时自动执行
# (见下面 initdb.d 的挂载)。之后新增的 schema 不会再跑 —— 加了新资源就:
#   docker compose -f infrastructure/postgres/compose.yaml down -v && ... up -d
# 数据卷一起删掉重来。本地开发的库本来就该随时能扔。
name: dev-postgres

services:

  # 刻意不写 container_name:固定名字会跟机器上已有的同名容器撞车,报出来的是
  # "Conflict. The container name is already in use",跟本项目看不出任何关系。
  # 交给 compose 按 name: 派生,多个服务共用同一份本地库(反正都占着 5432)。
  postgres:
    # 大版本跟着生产走,别用 rc/beta 标签:pg_upgrade 不跨 rc,
    # 本地攒下的数据卷换回正式版时打不开
    image: postgres:18-alpine
    restart: on-failure:5
    ports:
      - "5432:5432"
    volumes:
      # 挂在 /var/lib/postgresql,不是它下面的 data/:18 起官方镜像把数据放进
      # /var/lib/postgresql/<大版本>/docker(为了 pg_upgrade --link 不跨挂载点),
      # 还是按 17 那样挂 .../data 的话容器直接退出,报 "there appears to be
      # PostgreSQL data in /var/lib/postgresql/data (unused mount/volume)"
      - data:/var/lib/postgresql
      # 官方镜像在库初始化完之后按文件名顺序跑 /docker-entrypoint-initdb.d 下的
      # *.sql —— schema 文件的 000N_ 前缀就是为这个顺序准备的,建表顺序即外键顺序。
      # 只读挂载:这个目录只该被读,不该被容器写回仓库。
      - ../../internal/data/schema:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  data:
