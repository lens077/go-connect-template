# 本地开发配置样例。
#
# 这份文件不含任何真实凭据,可以安全提交:主机名一律指向 localhost,TLS 全部关闭。
#
# 密码分两类,别混:
#   - postgres / redis / 所选检索后端用的是 infrastructure/<组件>/compose.yaml
#     里写死的开发口令,两边必须一致 —— 写成占位符的话,照着 README 起完容器
#     再 make dev 依然连不上,而报错只是一句 password authentication failed。
#     改这里就要同步改对应的 compose(redis 的在 redis.conf)。
#   - casdoor / minio 这类没有随仓库提供本地容器的外部服务仍是 REPLACE_ME,
#     用到时自己填。
#
# 真实凭据请写进 configs/local.yml(已被 .gitignore 忽略):
#
#   CONFIG_SOURCE=file CONFIG_FILE=configs/local.yml go run ./cmd/server
#
# 注意:所有 Duration 字段必须写成带单位的字符串("5s"/"1h"),
# 裸数字解不出 durationpb,启动阶段就会报错。

server:
  addr: "0.0.0.0:30000"
  http:
    read_timeout: "10s"
    write_timeout: "10s"
    idle_timeout: "60s"
  cors:
    allowed_origins:
      - http://localhost:3000

data:
  database:
    postgres:
      host: "127.0.0.1"
      port: 5432
      user: "postgres"
      db_name: "postgres"
      # 与 infrastructure/postgres/compose.yaml 的 POSTGRES_PASSWORD 一致。
      # 真实密码放 configs/local.yml 或环境的配置中心,别提交
      password: "postgres"
      tls:
        # 本地库一般不开 TLS。要连开了 TLS 的库时把 enable 置 true、
        # ssl_mode 改成 verify-ca,并把 CA 证书整段贴进 ca_pem。
        enable: false
        ssl_mode: "disable"
        ca_pem: ""
        # ca_pem: |-
        #   -----BEGIN CERTIFICATE-----
        #   ...
        #   -----END CERTIFICATE-----
      timezone: "Asia/Shanghai"
      pool:
        max_conns: 20
        min_conns: 5
        # Duration 字段一律写成带单位的字符串;裸数字解不出 durationpb,启动会直接失败
        max_conn_lifetime: "1h"
        max_conn_idle_time: "5m"
        ping_timeout: "5s"
  # +co:begin redis
  cache:
    redis:
      host: "127.0.0.1"
      port: 6379
      tls:
        enable: false
        insecure_skip_verify: false
        ca_pem: ""
      username: "default"
      # 与 infrastructure/redis/redis.conf 的 requirepass 一致
      password: "devpassword"
      db: 0
      dial_timeout: "5s"
      read_timeout: "3s"
      write_timeout: "3s"
      pool_size: 10
      min_idle_conns: 5
  # +co:end

observability:
  # 本地没起 collector 时置 false,否则每次导出都会打一条连接失败的日志
  enable: false
  trace:
    endpoint: "127.0.0.1:4318"
    tls:
      enable: false
      insecure_skip_verify: false
      ca_pem: ""
  metric:
    endpoint: "127.0.0.1:4318"
    tls:
      enable: false
      insecure_skip_verify: false
      ca_pem: ""
  log:
    endpoint: "127.0.0.1:4318"
    tls:
      enable: false
      insecure_skip_verify: false
      ca_pem: ""

# +co:begin consul
discovery:
  consul:
    addr: "127.0.0.1:8500"
    health_check: true
    scheme: http
    check:
      # Consul Agent 判定服务失活的 TTL 窗口
      ttl:
        duration: "30s"
        # 心跳间隔必须明显小于 duration,否则窗口边缘会被误判为 critical
        ping_interval: "10s"
      # 持续 critical 超过这个时长就自动注销,避免僵尸实例堆积
      deregister_critical_service_after: "1m"
    tls:
      enable: false
      insecure_skip_verify: false
      ca_pem: ""
# +co:end

# +co:begin elasticsearch|meilisearch
search:
  catalog:
    # 两份本地 compose 都映射到同一个宿主机端口,生成后只会保留所选的一份。
    endpoint: "http://127.0.0.1:9200"
    # Basic Auth 示例。 +co:elasticsearch
    username: "elastic" # +co:elasticsearch
    password: "devpassword" # +co:elasticsearch
    # 本地 development 模式不启用鉴权。 +co:meilisearch
    api_key: "" # +co:meilisearch
    index: "products"
    tls:
      enable: false
      insecure_skip_verify: false
      ca_pem: ""
# +co:end

log:
  # application 是业务日志,framework 是 fx 框架自身的日志,两者独立控制:
  # 调试业务时把 application 调到 debug,不必被 fx 的依赖图刷屏
  application:
    level: debug
    format: console
  framework:
    log_level: info
    error_level: error
    format: console
  # +co:begin elasticsearch
  search:
    enable_request: true
    enable_response: true
  # +co:end

# +co:begin casdoor
auth:
  casdoor:
    endpoint: "http://127.0.0.1:8000"
    client_id: "REPLACE_ME"
    client_secret: "REPLACE_ME"
    organization_name: "REPLACE_ME"
    application_name: "REPLACE_ME"
    # Casdoor 应用的公钥证书,整段(含 BEGIN/END 行)贴进来
    certificate: "REPLACE_ME"
# +co:end

# +co:begin minio
store:
  minio:
    # 只配对外访问域名,不配 AK/SK:上传走各服务自己的 SDK 凭据,
    # 这里只负责把库里存的相对 key 拼成可访问的 URL(见 internal/pkg/minio.go)
    default_domain: "http://localhost:9000"
    # 按 bucket 覆盖默认域名,用于挂了独立 CDN 的桶
    buckets: {}
# +co:end
