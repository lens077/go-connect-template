apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-deploy
  labels:
    app: example
spec:
  replicas: 1
  selector:
    matchLabels:
      app: example
  template:
    metadata:
      name: example
      labels:
        app: example
    spec:
      # +co:begin config-configcenter
      # selector Secret 是 0400;fsGroup 让 UID/GID 1000 的非 root 进程可读。
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      # +co:end
      containers:
        - name: example
          image: example/example:dev
          imagePullPolicy: Always
          env:
            - name: SERVICE_NAME
              value: org-service-v1
            - name: CONSUL_ENABLED
              value: "true"
            - name: CONSUL_ADDR
              value: "consul.example.com:8501"
            - name: CONSUL_SCHEME
              value: "https"
            - name: CONSUL_INSECURE_SKIP_VERIFY
              value: "true"
            # +co:begin config-configcenter
            - name: CONFIG_SOURCE_FILE
              value: "/etc/config-source/source.yaml"
            # +co:end
          ports:
            - containerPort: 30002
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # +co:begin config-configcenter
          volumeMounts:
            - name: config-source
              mountPath: /etc/config-source
              readOnly: true
          # +co:end
#          envFrom:
#            - configMapRef:
#                name: example-config
#          livenessProbe:
#            httpGet:
#              path: /healthz
#              port: 30002
#            initialDelaySeconds: 20
#            periodSeconds: 10
#            failureThreshold: 3
#          readinessProbe:
#            httpGet:
#              path: /healthz
#              port: 30002

      # +co:begin config-configcenter
      volumes:
        - name: config-source
          secret:
            # 创建同名 Secret,其中 source.yaml 是含机器 token 的 selector。
            secretName: example-config-source
            defaultMode: 0400
      # +co:end
      restartPolicy: Always
